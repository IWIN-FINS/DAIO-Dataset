# Six shared validation/demonstration trajectories from data3/data4; these are not blind tests.
# Use them to select best.pt each epoch and generate demonstration results once after training.
experiment:
  name: v20_data34_shared_eval6_batch128_dropout0.3_phase1Epochs40
  seed: 42
  device: auto
  deterministic: false
  tf32: false

data:
  imu_hz: 200.0
  network_hz: 50.0
  window_samples: 256
  label_savgol_window: 15
  label_savgol_polyorder: 3
  pressure:
    atmosphere_pa: 101325.0
    water_density_kg_m3: 1000.0
    gravity_mps2: 9.80665
  preprocessing:
    rpm: raw_rpm_divide_1000_no_centering
    accel_xy: raw_flu_imu_accel_train_zscore
    gyro_z: raw_flu_imu_gyro_train_zscore
    depth: mean_absolute_pressure_to_depth_causal_zoh_train_zscore

model:
  name: v20_four_branch_cnn_transformer
  d_model: 64
  transformer_layers: 3
  transformer_heads: 4
  transformer_ffn_dim: 256
  dropout: 0.3
  max_tokens: 160

training:
  epochs: 80
  phase1_epochs: 40
  batch_size: 128
  num_workers: 0
  pin_memory: true
  lr: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 5.0
  huber_delta: 0.1
  nll_weight: 0.05
  log_every_batches: 0

evaluation:
  selection_metric: body_xy_rmse
  evaluate_demo_after_training: true
  plot_dpi: 150
