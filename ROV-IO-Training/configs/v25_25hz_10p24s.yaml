# V25: raw CSV is 200 Hz; causal means of eight consecutive samples form 25 Hz network input.
# The 256 input points span about 10.24 s of history; network outputs remain at 50 Hz.
experiment:
  name: v25_25hz_10p24s_shared_validation
  seed: 42
  device: auto
  deterministic: false
  tf32: false

data:
  source_format: processed_csv_200hz
  imu_hz: 200.0                 # Legacy-compatible field; same as source_sample_hz
  source_sample_hz: 200.0       # Fixed raw sample_time_s frequency
  network_input_hz: 25.0        # Network input frequency after causal eight-sample means
  network_hz: 50.0              # One velocity prediction every 20 ms
  window_samples: 256           # 256 * 8 / 200 s = 10.24 s
  label_savgol_window_s: 0.50   # Labels still use the raw 200 Hz tag timeline
  label_savgol_polyorder: 3
  preprocessing:
    downsample: consecutive_eight_sample_causal_mean_200hz_to_25hz
    rpm: signed_rpm_causal_mean_then_divide_1000_no_centering
    accel_xy: raw_acc_x_acc_y_causal_mean_then_global_train_zscore
    gyro_z: raw_gyro_z_causal_mean_then_global_train_zscore
    depth: direct_physical_depth_m_causal_mean_then_global_train_zscore
    apriltag_labels: raw_tag_xy_yaw_savgol_0p5s_world_to_body_no_legacy_axis_map

model:
  name: v25_four_branch_cnn_transformer
  d_model: 64
  transformer_layers: 3
  transformer_heads: 4
  transformer_ffn_dim: 256
  dropout: 0.5
  max_tokens: 160

training:
  epochs: 80
  phase1_epochs: 40
  batch_size: 128
  num_workers: 0
  pin_memory: true
  lr: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 5.0
  huber_delta: 0.1
  nll_weight: 0.05
  log_every_batches: 0

evaluation:
  selection_metric: body_xy_rmse
  evaluate_demo_after_training: true
  plot_dpi: 150
