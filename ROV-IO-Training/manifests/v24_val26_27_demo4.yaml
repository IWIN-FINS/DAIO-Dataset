# 新实验划分：026/027 用于选模，其余四条仅用于训练结束后的展示评估。
schema_version: 3
data_format: processed_csv_200hz
coordinate_frame: "FLU; +x forward, +y left, +z upward"
offline_apriltag_only: true
processed_root: processed
splits:
  train:
    glob: "v*/*.csv"
    exclude_files:
      - v2/025_demo__segment_001.csv
      - v2/026_demo__segment_001.csv
      - v2/027_demo__segment_001.csv
      - v2/028_demo__segment_001.csv
      - v2/029_demo__segment_001.csv
      - v2/030_demo__segment_001.csv
    expected_count: 76
  val:
    files:
      - v2/026_demo__segment_001.csv
      - v2/027_demo__segment_001.csv
    expected_count: 2
  demo:
    files:
      - v2/025_demo__segment_001.csv
      - v2/028_demo__segment_001.csv
      - v2/029_demo__segment_001.csv
      - v2/030_demo__segment_001.csv
    expected_count: 4
