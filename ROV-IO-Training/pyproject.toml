[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rovio-training"
version = "0.1.0"
description = "Maintainable V20-compatible ROV body-velocity training"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==2.2.6",
  "scipy==1.15.3",
  "h5py==3.16.0",
  "PyYAML==6.0.3",
  "matplotlib==3.10.9",
  "torch==2.9.1+cu128",
  "tensorboard==2.21.0",
  "tqdm==4.69.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
