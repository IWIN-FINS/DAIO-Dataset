# Final public dataset layout (self-contained copy matching ROV-IO-Training/manifests/processed_v1.yaml).
# This project points data.root directly to ROV-RPM-IMU-Dataset-v1/processed,
# so processed_root is "." and glob patterns are relative to that directory.
schema_version: 1
coordinate_frame: "FLU; +x forward, +y left, +z upward"
offline_apriltag_only: true
processed_root: "."
splits:
  train:
    glob: "train/**/*.h5"
    expected_count: 69
  val:
    glob: "evaluation/paper/**/*.h5"
    expected_count: 2
  demo:
    glob: "demo/**/*.h5"
    expected_count: 2
