# 最终公开数据集的目录布局（自包含副本，与 ROV-IO-Training/manifests/processed_v1.yaml 一致）。
# 说明：本工程把 data.root 直接指向 ROV-RPM-IMU-Dataset-v1/processed，
# 因此 processed_root 为 "."，glob 直接相对于该目录。
schema_version: 1
coordinate_frame: "FLU; +x forward, +y left, +z upward"
offline_apriltag_only: true
processed_root: "."
splits:
  train:
    glob: "train/**/*.h5"
    expected_count: 69
  val:
    glob: "evaluation/paper/**/*.h5"
    expected_count: 2
  demo:
    glob: "demo/**/*.h5"
    expected_count: 2
