# Deployment/replay without external observations: AprilTag is neither read nor required.
data:
  root: "../../ROV-RPM-IMU-Dataset-v1/processed"
  manifest: "processed_v1.yaml"
  split: "demo"
  records: []
  imu_hz: 200.0
  network_hz: 50.0
  window_samples: 256
  pressure: {atmosphere_pa: 101325.0, water_density_kg_m3: 1000.0, gravity_mps2: 9.80665}
model:
  checkpoint: "../../ROV-IO-Training/runs/v20_batch64_dropout0.3_phase1Epochs40/20260820-151440_seed42/best.pt"
  device: "auto"
  batch_size: 128
initialization:
  startup_s: 10.0
  position_std_m: 0.5
  velocity_std_mps: 0.3
  accel_bias_std_mps2: 0.2
  yaw_std_rad: 0.13962634
  yaw_rate_correction_std_radps: 0.05
filter:
  gravity_flu: [0.0, 0.0, -9.80665]
  accel_sample_covariance: [[1.508053e-2, 6.003840e-4, 2.773057e-4], [6.003840e-4, 1.164699e-2, -8.962351e-4], [2.773057e-4, -8.962351e-4, 1.629901e-2]]
  accel_bias_rw_psd: [[1.028425e-3, 0.0, 0.0], [0.0, 1.014470e-3, 0.0], [0.0, 0.0, 5.826577e-4]]
  yaw_rate_source_psd_rad2_per_s: 8.3e-7
  yaw_rate_correction_rw_psd_rad2_per_s3: 3.34e-6
  yaw_rate_source:
    backward_window_s: 0.05
    median_filter_samples: 5
    max_abs_rate_radps: 1.0
  height_variance_m2: 5.110808e-5
  depth_nis_gate_1d: 6.63
  velocity_nis_gate_2d: 9.21
  yaw_rate_nis_gate_1d: 6.63
  network:
    xy: {covariance_scale: 16.0, min_std: 0.005, max_std: 2.0, max_step_mps: 0.10}
    yaw_rate: {variance_scale: 16.0, min_std: 0.005, max_std: 2.0}
benchmark: {yaw_reanchor_std_rad: 0.035}
evaluation:
  mode: "deployment_relative_yaw"
  reference_savgol_window: 15
  reference_savgol_polyorder: 3
  plot_dpi: 150
debug: {max_imu_gap_s: 0.0125, save_event_trace: true, save_covariance: true, save_plots: true}
output: {root: "../runs", run_name: "deployment_v20"}
