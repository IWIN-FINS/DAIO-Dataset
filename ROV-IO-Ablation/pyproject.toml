[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rovio-ablation"
version = "0.1.0"
description = "Reproducible V24 modality and architecture ablations"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "h5py", "PyYAML", "matplotlib", "torch>=2.9", "tensorboard"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
